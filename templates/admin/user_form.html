{% extends 'base.html' %}
{% block title %}{{ action }} Utilisateur{% endblock %}

{% block content %}
<div class="container">
  <div class="page-header">
    <h1>👤 {{ action }} Utilisateur</h1>
  </div>

  <div class="card" style="max-width:500px;">
    <div class="card-body">
      <form method="POST">

        <div class="form-group">
          <label>Username *</label>
          <input type="text" name="username" value="{{ user.username if user }}"
                 required autofocus placeholder="ex: agent01">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ user.email if user }}"
                 placeholder="optionnel">
        </div>

        <div class="form-group">
          <label>Mot de passe {{ '' if user else '*' }}</label>
          <input type="password" name="password"
                 {{ '' if user else 'required' }}
                 placeholder="{{ 'Laisser vide pour conserver' if user else 'Minimum 6 caractères' }}"
                 minlength="6">
        </div>

        <div class="form-group">
          <label>Rôle *</label>
          <select name="role" onchange="toggleFields(this.value)">
            {% for r in roles %}
            <option value="{{ r }}" {{ 'selected' if user and user.role == r }}>{{ r }}</option>
            {% endfor %}
          </select>
          <small style="color:var(--text-m); font-size:11px; margin-top:4px; display:block;">
            admin = accès total · agent = gestion + génération · fr = lecture seule de ses factures
          </small>
        </div>

        <div id="fr-fields" style="display:none;">
          <div class="form-group">
            <label>Société (pour rôle FR)</label>
            <select name="societe">
              <option value="">—</option>
              <option value="BESTMARK"     {{ 'selected' if user and user.societe == 'BESTMARK' }}>BESTMARK</option>
              <option value="AFRINETWORKS" {{ 'selected' if user and user.societe == 'AFRINETWORKS' }}>AFRINETWORKS</option>
            </select>
          </div>
          <div class="form-group">
            <label>Code POS (pour rôle FR)</label>
            <input type="text" name="code_magasin"
                   value="{{ user.code_magasin if user }}"
                   placeholder="ex: 1355">
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="submit" class="btn btn-primary">{{ action }}</button>
          <a href="{{ url_for('admin.users') }}" class="btn btn-gray">Annuler</a>
        </div>

      </form>
    </div>
  </div>
</div>

{% block scripts %}
<script>
function toggleFields(role) {
  document.getElementById('fr-fields').style.display = role === 'fr' ? 'block' : 'none';
}
toggleFields(document.querySelector('[name=role]').value);
</script>
{% endblock %}
{% endblock %}
