<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Facturation Telecom</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-wrapper">
  <div class="login-box">

    <div class="login-logo">
      <div class="icon">⬡</div>
      <h1>Facturation Telecom</h1>
      <p>BESTMARK &amp; AFRINETWORKS</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="username">Identifiant</label>
        <input type="text" id="username" name="username"
               placeholder="Votre identifiant"
               autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••"
               autocomplete="current-password" required>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="remember" name="remember"
               style="width:auto; accent-color: var(--accent);">
        <label for="remember" style="margin:0; font-weight:400; cursor:pointer;">
          Se souvenir de moi
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:10px;">
        Connexion
      </button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:11px; color:var(--text-l);">
      © 2026 Powered by Soufiane
    </p>
  </div>
</div>

</body>
</html>
